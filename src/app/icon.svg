<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- VK monogram. Letters are drawn as stroked paths, not text, so the mark
       renders identically everywhere without depending on an available font.
       Colours are the site's accent fill gradient with the ink foreground the
       rest of the UI uses on top of an accent fill. -->
  <defs>
    <linearGradient id="vk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#fb7185" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#vk)" />
  <g
    fill="none"
    stroke="#1c1917"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M13 20 L21.5 44 L30 20" />
    <path d="M38.5 20 L38.5 44" />
    <path d="M51 20 L39 32 L51 44" />
  </g>
</svg>
